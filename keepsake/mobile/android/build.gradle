allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(':app')
    // maplibre_gl skips kotlin-android on AGP 9 assuming builtInKotlin=true,
    // while Flutter's migrator sets android.builtInKotlin=false for legacy plugins.
    if (project.name == 'maplibre_gl') {
        project.pluginManager.withPlugin('com.android.library') {
            project.apply plugin: 'org.jetbrains.kotlin.android'
        }
    }
    // Ensure older plugins (e.g. bonsoir_android targeting API 33) compile against API 36
    // using AGP 9's official finalizeDsl hook (before compileSdk is locked).
    project.pluginManager.withPlugin('com.android.library') {
        project.extensions.configure(com.android.build.api.variant.LibraryAndroidComponentsExtension) { components ->
            components.finalizeDsl { ext ->
                if (ext.compileSdk == null || ext.compileSdk < 36) {
                    ext.compileSdk = 36
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

tasks.named('wrapper') {
    distributionType = Wrapper.DistributionType.ALL
}
